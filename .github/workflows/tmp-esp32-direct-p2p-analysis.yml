name: Temporary ESP32 direct P2P footprint analysis

on:
  push:
    branches:
      - "tmp/report-static-esp32-size"
    paths:
      - ".github/workflows/tmp-esp32-direct-p2p-analysis.yml"
  workflow_dispatch:

jobs:
  measure:
    name: ${{ matrix.target }} / direct P2P without SafeStream
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c6]
        include:
          - target: esp32
            project_path: projects/xtensa_lx6/vscode/aether-client-cpp
          - target: esp32c6
            project_path: projects/espressif_riscv/vscode/aether-client-cpp

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply tuned production profile and direct P2P example
        shell: bash
        run: |
          cat > config/user_config_report_esp32_udp.h <<'EOF'
          #ifndef CONFIG_USER_CONFIG_REPORT_ESP32_UDP_H_
          #define CONFIG_USER_CONFIG_REPORT_ESP32_UDP_H_
          #include "aether/config_consts.h"
          #define AE_CRYPTO_ASYNC AE_HYDRO_CRYPTO_PK
          #define AE_CRYPTO_SYNC AE_HYDRO_CRYPTO_SK
          #define AE_KDF AE_HYDRO_KDF
          #define AE_CRYPTO_HASH AE_HYDRO_HASH
          #define AE_SUPPORT_IPV4 1
          #define AE_SUPPORT_IPV6 0
          #define AE_SUPPORT_UDP 1
          #define AE_SUPPORT_TCP 0
          #define AE_SUPPORT_WEBSOCKET 0
          #define AE_SUPPORT_HTTP 0
          #define AE_SUPPORT_HTTP_OVER_TCP 0
          #define AE_SUPPORT_HTTP_WINHTTP 0
          #define AE_SUPPORT_HTTPS 0
          #define AE_SUPPORT_PROXY 0
          #define AE_SUPPORT_DYNAMIC_PROXY 0
          #define AE_SUPPORT_REGISTRATION 0
          #define AE_SUPPORT_CLOUD_DNS 0
          #define AE_SUPPORT_DYNAMIC_CLOUD_DNS 0
          #define AE_SUPPORT_CLOUD_IPS 1
          #define AE_SUPPORT_DYNAMIC_CLOUD_IPS 0
          #define AE_SUPPORT_WIFIS 1
          #define AE_ENABLE_ESP32_WIFI 1
          #define AE_SUPPORT_MODEMS 0
          #define AE_SUPPORT_LORA 0
          #define AE_SUPPORT_GATEWAY 0
          #define AE_SUPPORT_SPIFS_FS 0
          #define AE_TELE_ENABLED 0
          #define AE_TELE_COMPILATION_INFO 0
          #define AE_TELE_RUNTIME_INFO AE_NONE
          #define AE_TELE_LOG_CONSOLE 0
          #define AE_TELE_LOG_TO_STATISTICS 0
          #define AE_CLOUD_MAX_SERVER_CONNECTIONS 1
          #define AE_SAFE_STREAM_CAPACITY (2 * 1024)
          #define AE_ENABLE_PING 0
          #endif
          EOF

          cat >> "${{ matrix.project_path }}/sdkconfig.defaults" <<'EOF'

          CONFIG_COMPILER_OPTIMIZATION_SIZE=y
          CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_DISABLE=y
          CONFIG_COMPILER_CXX_EXCEPTIONS=n
          CONFIG_COMPILER_CXX_RTTI=n
          CONFIG_LOG_DEFAULT_LEVEL_NONE=y
          CONFIG_BOOTLOADER_LOG_LEVEL_NONE=y
          CONFIG_LWIP_IPV6=n
          CONFIG_LWIP_STATS=n
          CONFIG_ESP_WIFI_ENABLE_WIFI_RX_STATS=n
          CONFIG_ESP_WIFI_ENABLE_WIFI_TX_STATS=n
          CONFIG_ESP_WIFI_NVS_ENABLED=n
          EOF

          cat > examples/cloud/cloud_test.cpp <<'EOF'
          #include <array>
          #include <chrono>
          #include <cstdint>
          #include <memory>

          #include "aether/all.h"
          #include "aether/client_messages/p2p_message_stream.h"

          #define AE_EXAMPLE_LORA_MODULE 0
          #define AE_EXAMPLE_MODEM 0
          #if defined ESP_PLATFORM
          #  define AE_EXAMPLE_ESP_WIFI 1
          #else
          #  define AE_EXAMPLE_ETHERNET 1
          #endif
          #include "../common/aether_construct_esp_wifi.h"
          #include "../common/aether_construct_ethernet.h"
          #include "../common/aether_construct_lora_module.h"
          #include "../common/aether_construct_modem.h"

          namespace ae::examples {
          static constexpr inline auto kParentUid =
              ae::Uid::FromString("3ac93165-3d37-4970-87a6-fa4ee27744e4");
          }

          int AetherCloudExample() {
            auto app = ae::examples::construct_aether_app();
            ae::Client::ptr client_a;
            ae::Client::ptr client_b;

            auto& select_a = app->aether()->SelectClient(ae::examples::kParentUid, "A");
            select_a.result_event().Subscribe([&](auto&& result) {
              if (result) client_a = std::move(result).value();
              else app->Exit(1);
            });
            auto& select_b = app->aether()->SelectClient(ae::examples::kParentUid, "B");
            select_b.result_event().Subscribe([&](auto&& result) {
              if (result) client_b = std::move(result).value();
              else app->Exit(1);
            });
            app->WaitActions(select_a, select_b);
            assert(client_a && client_b);

            bool sent = false;
            bool received = false;
            std::shared_ptr<ae::P2pStream> receiver;

            client_a->message_stream_manager().new_port_event().Subscribe(
                [&](ae::P2pPortHandle handle) {
                  receiver = std::make_shared<ae::P2pStream>(
                      *app, client_a.Load(), handle.destination(), std::move(handle));
                  receiver->out_data_event().Subscribe(
                      [&](auto const&) { received = true; });
                });

            auto handle =
                client_b->message_stream_manager().CreatePort(client_a->uid());
            auto sender = std::make_shared<ae::P2pStream>(
                *app, client_b.Load(), client_a->uid(), std::move(handle));

            ae::DataBuffer data{1, 2, 3, 4};
            auto& action = sender->Write(std::move(data));
            action.status_event().Subscribe([&](auto status) {
              if (status == ae::WriteAction::Status::kSuccess) sent = true;
              else app->Exit(1);
            });

            while (!app->IsExited()) {
              if (sent && received) {
                app->Exit(0);
                continue;
              }
              auto now = ae::Now();
              auto next = app->Update(now);
              app->WaitUntil(std::min(next, now + std::chrono::seconds{5}));
            }
            return app->ExitCode();
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("examples/cloud/main.cpp")
          t = p.read_text().replace('#  include <iostream>\n', '')
          old = '''  esp_err_t err = esp_task_wdt_reconfigure(&config_wdt);
            if (err != 0) {
              std::cerr << "Reconfigure WDT is failed!\\n";
            }
          '''
          assert t.count(old) == 1
          p.write_text(t.replace(old, '''  esp_err_t err = esp_task_wdt_reconfigure(&config_wdt);
            (void)err;
          ''', 1))

          p = Path("aether/aether_app.cpp")
          t = p.read_text().replace("#include <iostream>\n", "", 1)
          old = "return tele::TeleStatistics::ptr{};"
          assert t.count(old) == 1
          p.write_text(t.replace(old, "return TeleStatistics::ptr{};", 1))

          p = Path("aether/client.cpp")
          t = p.read_text()
          begin = "  connectivity_policy_ = ClientConnectivityPolicy::ptr::Create("
          end = "      Aether::ptr{aether_}, Client::ptr::MakeFromThis(this));"
          assert t.count(begin) == 1 and t.count(end) == 1
          t = t.replace(begin, "#if AE_DISTILLATION\n" + begin, 1)
          p.write_text(t.replace(end, end + "\n#endif", 1))

          for filename, old_sig, new_sig in [
              ("aether/channels/wifi_channel.cpp",
               "ResolveSender ResolveAddress(PtrView<DnsResolver> const& resolver,\n                             NamedAddr const& addr, std::uint16_t port,\n                             Protocol protocol)",
               "ResolveSender ResolveAddress([[maybe_unused]] PtrView<DnsResolver> const& resolver,\n                             [[maybe_unused]] NamedAddr const& addr,\n                             [[maybe_unused]] std::uint16_t port,\n                             [[maybe_unused]] Protocol protocol)"),
              ("aether/channels/ethernet_channel.cpp",
               "ResolveSender ResolveAddress(Ptr<DnsResolver> const& resolver,\n                             NamedAddr const& addr, std::uint16_t port,\n                             Protocol protocol)",
               "ResolveSender ResolveAddress([[maybe_unused]] Ptr<DnsResolver> const& resolver,\n                             [[maybe_unused]] NamedAddr const& addr,\n                             [[maybe_unused]] std::uint16_t port,\n                             [[maybe_unused]] Protocol protocol)")]:
              p = Path(filename)
              t = p.read_text()
              assert t.count(old_sig) == 1
              p.write_text(t.replace(old_sig, new_sig, 1))
          PY

          cat > aether/obj/obj_id.cpp <<'EOF'
          #include "aether/obj/obj_id.h"
          #include <hydrogen.h>
          namespace ae { ObjId ObjId::GenerateUnique() { ObjId::Type v; do { v = static_cast<ObjId::Type>(hydro_random_u32()); } while (v < 10000); return ObjId{v}; } }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("CMakeLists.txt")
          t = p.read_text()
          marker = '''CPMAddPackage(
            NAME libsodium'''
          insert = '''target_compile_options(hydrogen PRIVATE -Os -ffunction-sections -fdata-sections -flto=auto)
          set_property(TARGET hydrogen PROPERTY INTERPROCEDURAL_OPTIMIZATION TRUE)

          CPMAddPackage(
            NAME libsodium'''
          assert t.count(marker) == 1
          p.write_text(t.replace(marker, insert, 1))
          PY

          cat > .github/tmp-esp32-direct-p2p.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          idf.py --version > build-idf-version.txt
          idf.py build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCOMPILE_EXAMPLE=cloud \
            -DUSER_CONFIG=../../../../../config/user_config_report_esp32_udp.h \
            -DAE_DISTILLATION=OFF -DAE_FILTRATION=OFF
          idf.py size > build/size-summary.txt
          idf.py size-components > build/size-components.txt
          idf.py size-files > build/size-files.txt
          cp build-idf-version.txt build/idf-version.txt
          EOF
          chmod +x .github/tmp-esp32-direct-p2p.sh

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: latest
          target: ${{ matrix.target }}
          path: ${{ matrix.project_path }}
          command: bash ../../../../.github/tmp-esp32-direct-p2p.sh

      - name: Collect
        shell: bash
        run: |
          base="${{ matrix.project_path }}/build"
          mkdir -p report
          cp "$base/Aether.bin" report/
          cp "$base/Aether.elf" report/
          cp "$base/Aether.map" report/
          cp "$base/size-summary.txt" report/
          cp "$base/size-components.txt" report/
          cp "$base/size-files.txt" report/
          cp "$base/idf-version.txt" report/
          cp "${{ matrix.project_path }}/sdkconfig" report/sdkconfig
          stat -c '%n %s' report/Aether.bin report/Aether.elf report/Aether.map > report/file-sizes.txt
          printf 'target=%s\nvariant=direct_p2p_without_safe_stream\n' '${{ matrix.target }}' > report/profile.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: esp32-direct-p2p-${{ matrix.target }}
          path: report/*
          compression-level: 9
          overwrite: true
